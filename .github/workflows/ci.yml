name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spark-streaming-job/requirements-dev.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r spark-streaming-job/requirements-dev.txt

      - name: Run tests
        working-directory: spark-streaming-job
        run: pytest

  docker-build:
    name: Build image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: dob-permits-poller,    context: . }
          - { name: generic-socrata-poller, context: generic-socrata-poller }
          - { name: spark-streaming-job,   context: spark-streaming-job }
          - { name: lakehouse-batch-job,   context: lakehouse-batch-job }
          - { name: report-job,            context: report-job }
          - { name: heatmap-job,           context: heatmap-job }
          - { name: airflow,               context: airflow }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: nyc-realestate/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  test-in-container:
    name: Unit tests inside the streaming image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build streaming image
        uses: docker/build-push-action@v6
        with:
          context: spark-streaming-job
          push: false
          load: true
          tags: nyc-realestate/spark-streaming-job:ci
          cache-from: type=gha,scope=spark-streaming-job
      - name: Run pytest in the image
        run: |
          docker run --rm \
            -e PYSPARK_SUBMIT_ARGS="pyspark-shell" \
            -v "$PWD/spark-streaming-job/tests:/app/tests:ro" \
            -v "$PWD/spark-streaming-job/pytest.ini:/app/pytest.ini:ro" \
            -v "$PWD/spark-streaming-job/requirements-dev.txt:/app/requirements-dev.txt:ro" \
            --entrypoint sh nyc-realestate/spark-streaming-job:ci \
            -c "pip install --quiet pytest==8.3.3 && pytest"
