# Merge into your existing compose file (or: docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d)
services:
  dashboard:
    image: nginx:alpine
    ports:
      - "8088:80"            # http://localhost:8088
    volumes:
      - dashboard_site:/usr/share/nginx/html:ro
    restart: unless-stopped

  airflow-scheduler:         # add to your existing Airflow services (worker too, if CeleryExecutor)
    volumes:
      - dashboard_site:/opt/dashboard
      - ./dashboard/build_dashboard.py:/opt/airflow/dags/build_dashboard.py:ro
      - ./dashboard/dashboard_hourly_dag.py:/opt/airflow/dags/dashboard_hourly_dag.py:ro

volumes:
  dashboard_site:
