services:

  # ---------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # Cassandra
  # ---------------------------------------------------------------------
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: nyc_realestate_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # MinIO
  # ---------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # POLLERS
  # ---------------------------------------------------------------------
  dob-permits-poller:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: permits.dob
      FETCH_LIMIT: 50
      POLL_INTERVAL_SECONDS: 0
      SOCRATA_APP_TOKEN: ""
    networks:
      - platform_net

  acris-poller:
    build: ./generic-socrata-poller
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SOCRATA_URL: "https://data.cityofnewyork.us/resource/bnx9-e6tj.json"
      ORDER_FIELD: ""
      KEY_FIELD: "document_id"
      KAFKA_TOPIC: "sales.acris"
      FETCH_LIMIT: "50"
    networks:
      - platform_net

  pluto-poller:
    build: ./generic-socrata-poller
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SOCRATA_URL: "https://data.cityofnewyork.us/resource/64uk-42ks.json"
      KEY_FIELD: "bbl"
      KAFKA_TOPIC: "parcels.pluto"
      FETCH_LIMIT: "50"
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # STREAMING TIME
  # ---------------------------------------------------------------------
  spark-streaming-job:
    build: ./spark-streaming-job
    depends_on:
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
    environment:
      SOURCE_TYPE: dob
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: permits.dob
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: nyc_realestate
      CASSANDRA_TABLE: permits_current
    restart: unless-stopped
    networks: [platform_net]

  acris-streaming-job:
    build: ./spark-streaming-job
    depends_on:
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
    environment:
      SOURCE_TYPE: acris
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: sales.acris
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: nyc_realestate
      CASSANDRA_TABLE: sales_acris
    restart: unless-stopped
    networks: [platform_net]

  pluto-streaming-job:
    build: ./spark-streaming-job
    depends_on:
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
    environment:
      SOURCE_TYPE: pluto
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: parcels.pluto
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: nyc_realestate
      CASSANDRA_TABLE: parcels_pluto
    restart: unless-stopped
    networks: [platform_net]


networks:
  platform_net:
    driver: bridge

volumes:
  kafka_data:
  cassandra_data:
  minio_data:

