services:

  # ---------------------------------------------------------------------
  # Kafka
  # ---------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # Cassandra
  # ---------------------------------------------------------------------
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: nyc_realestate_cluster
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # MinIO
  # ---------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # POLLERS
  # ---------------------------------------------------------------------
  dob-permits-poller:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: permits.dob
      FETCH_LIMIT: 50
      POLL_INTERVAL_SECONDS: 0
      SOCRATA_APP_TOKEN: ""
    networks:
      - platform_net

  acris-poller:
    build: ./generic-socrata-poller
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SOCRATA_URL: "https://data.cityofnewyork.us/resource/bnx9-e6tj.json"
      ORDER_FIELD: ""
      KEY_FIELD: "document_id"
      KAFKA_TOPIC: "sales.acris"
      FETCH_LIMIT: "50"
    networks:
      - platform_net

  pluto-poller:
    build: ./generic-socrata-poller
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SOCRATA_URL: "https://data.cityofnewyork.us/resource/64uk-42ks.json"
      KEY_FIELD: "bbl"
      KAFKA_TOPIC: "parcels.pluto"
      FETCH_LIMIT: "50"
    networks:
      - platform_net

  # ---------------------------------------------------------------------
  # STREAMING TIME
  # ---------------------------------------------------------------------
  spark-streaming-job:
    build: ./spark-streaming-job
    depends_on:
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
    environment:
      SOURCE_TYPE: dob
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: permits.dob
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: nyc_realestate
      CASSANDRA_TABLE: permits_current
    restart: unless-stopped
    networks: [platform_net]

  acris-streaming-job:
    build: ./spark-streaming-job
    depends_on:
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
    environment:
      SOURCE_TYPE: acris
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: sales.acris
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: nyc_realestate
      CASSANDRA_TABLE: sales_acris
    restart: unless-stopped
    networks: [platform_net]

  pluto-streaming-job:
    build: ./spark-streaming-job
    depends_on:
      kafka: {condition: service_healthy}
      cassandra: {condition: service_healthy}
    environment:
      SOURCE_TYPE: pluto
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: parcels.pluto
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: nyc_realestate
      CASSANDRA_TABLE: parcels_pluto
    restart: unless-stopped
    networks: [platform_net]

  lakehouse-batch-job:
    build: ./lakehouse-batch-job
    depends_on:
      cassandra: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment:
      CASSANDRA_HOST: cassandra
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: lakehouse
    networks: [platform_net]

  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    networks: [platform_net]

  airflow-init:
    build: ./airflow
    depends_on: [airflow-postgres]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      entrypoint: bash -c "airflow db init && airflow users create --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} --firstname a --lastname a --role Admin --email admin@example.com"
    networks: [platform_net]

  airflow-webserver:
    build: ./airflow
    depends_on: [airflow-init]
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8080:8080"]
    command: webserver
    networks: [platform_net]

  airflow-scheduler:
    build: ./airflow
    depends_on: [airflow-init]
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    networks: [platform_net]

  report-job:
    build: ./report-job
    depends_on:
      cassandra: {condition: service_healthy}
    environment:
      CASSANDRA_HOST: cassandra
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      REPORT_FROM_EMAIL: "${REPORT_FROM_EMAIL}"
      REPORT_TO_EMAIL: "${REPORT_TO_EMAIL}"
    networks: [platform_net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports: ["8085:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [platform_net]

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka: {condition: service_healthy}
    networks: [platform_net]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [platform_net]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [platform_net]

networks:
  platform_net:
    driver: bridge

volumes:
  kafka_data:
  cassandra_data:
  minio_data:

